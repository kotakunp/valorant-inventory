[phases.install]
# Playwright-managed Chromium matches playwright-core's browsers.json (153.x).
# System nix chromium is 132 — CDP mismatch → random Target crashed.
cmds = ["npm ci", "npx playwright-core install chromium"]

[phases.build]
cmds = ["npm run build"]

[start]
# Best-effort Xvfb for headed Chromium; never block the app if Xvfb is broken/missing.
cmd = "sh -c 'command -v Xvfb >/dev/null 2>&1 && { Xvfb :99 -screen 0 1280x800x24 >/tmp/xvfb.log 2>&1 & export DISPLAY=:99; }; exec npm start'"

# Node comes from the official nodejs.org release (checksum-verified), not
# Nixpacks' pinned nixpkgs, which lags Node security releases. To update
# Node, change V below and redeploy.
[phases.setup]
nixPkgs = ["chromium", "xorg.xvfb", "fontconfig", "dejavu_fonts"]
aptPkgs = ["curl", "xz-utils", "ca-certificates"]
cmds = [
  'set -e; V=22.23.4; A=$(uname -m | sed -e s/x86_64/x64/ -e s/aarch64/arm64/); F=node-v$V-linux-$A.tar.xz; cd /tmp; curl -fsSLO https://nodejs.org/dist/v$V/$F; curl -fsSL https://nodejs.org/dist/v$V/SHASUMS256.txt | grep " $F$" | sha256sum -c -; tar -xJf $F -C /usr --strip-components=1 --exclude=CHANGELOG.md --exclude=LICENSE --exclude=README.md; rm $F; node -v',
]
